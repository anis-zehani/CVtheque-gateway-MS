apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    app: gateway-MS
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-MS
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gateway-MS
    spec:
      containers:
      - name: gateway-container
        image: registry.gitlab.com/gitlabodix/cvtheque-gateway-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: gitlab-secrets-gateway-ms
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway-MS
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

